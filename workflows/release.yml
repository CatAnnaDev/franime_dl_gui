name: Release auto

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write
concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    name: Calcule la version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.compute.outputs.tag }}
      version: ${{ steps.compute.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Toolchain stable
        uses: dtolnay/rust-toolchain@stable

      - name: Détermine le prochain numéro
        id: compute
        shell: bash
        run: |
          set -euo pipefail
          git fetch --tags --force --quiet || true

          # Version déclarée dans Cargo.toml (sans dépendance à jq sur ce point).
          cargo_ver=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[0].version')

          # Dernier tag publié de la forme vX.Y.Z, le plus élevé.
          latest=$(git tag -l 'v*.*.*' | sed 's/^v//' | sort -V | tail -n1 || true)

          if [[ -z "${latest}" ]]; then
            # Aucune release encore : on part de la version de Cargo.toml.
            next="${cargo_ver}"
          else
            # On incrémente le patch du dernier tag...
            IFS='.' read -r MA MI PA <<< "${latest}"
            bumped="${MA}.${MI}.$((PA + 1))"
            # ...mais si Cargo.toml demande plus haut, on respecte Cargo.toml.
            next=$(printf '%s\n%s\n' "${cargo_ver}" "${bumped}" | sort -V | tail -n1)
          fi

          # Sécurité : si ce tag existe déjà, on monte le patch jusqu'à un libre.
          while git rev-parse "v${next}" >/dev/null 2>&1; do
            IFS='.' read -r MA MI PA <<< "${next}"
            next="${MA}.${MI}.$((PA + 1))"
          done

          echo "version=${next}"     >> "$GITHUB_OUTPUT"
          echo "tag=v${next}"        >> "$GITHUB_OUTPUT"
          echo "Prochaine version : v${next}"

  build:
    name: Build ${{ matrix.target }}
    needs: version
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            linker: gcc-aarch64-linux-gnu
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain stable (+ cible ${{ matrix.target }})
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Linker de cross-compilation (Linux arm64 uniquement)
        if: matrix.linker
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.linker }}
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"

      - name: Build release
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Empaquette les binaires
        id: package
        shell: bash
        env:
          VERSION: ${{ needs.version.outputs.tag }}
        run: |
          set -euo pipefail
          target="${{ matrix.target }}"
          bindir="target/${target}/release"

          bins=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[].targets[] | select(.kind[] == "bin") | .name')

          if [[ -z "${bins}" ]]; then
            echo "Aucun binaire (lib seule) — rien à empaqueter."
            echo "asset=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          ext=""
          [[ "${target}" == *windows* ]] && ext=".exe"

          stage="pkg"
          mkdir -p "${stage}"
          for bin in ${bins}; do
            src="${bindir}/${bin}${ext}"
            if [[ -f "${src}" ]]; then
              cp "${src}" "${stage}/"
            else
              echo "::warning::binaire attendu introuvable : ${src}"
            fi
          done

          base="$(basename "$(git rev-parse --show-toplevel)")-${VERSION}-${target}"
          if [[ "${target}" == *windows* ]]; then
            asset="${base}.zip"
            powershell -Command "Compress-Archive -Path '${stage}/*' -DestinationPath '${asset}'"
          else
            asset="${base}.tar.gz"
            tar -czf "${asset}" -C "${stage}" .
          fi

          echo "asset=${asset}" >> "$GITHUB_OUTPUT"
          echo "Archive : ${asset}"

      - name: Téléverse l'artefact
        if: steps.package.outputs.asset != ''
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: ${{ steps.package.outputs.asset }}
          if-no-files-found: error

  release:
    name: Publie la Release ${{ needs.version.outputs.tag }}
    needs: [version, build]
    runs-on: ubuntu-latest
    steps:
      - name: Récupère toutes les archives
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Crée la Release (et pose le tag automatiquement)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: ${{ needs.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: false
